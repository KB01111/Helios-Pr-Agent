name: PR Agent (Inkling-2-small:free)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  pr_agent_job:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
          (github.event_name != 'issue_comment' ||
           (github.event.issue.pull_request &&
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for OpenRouter key
        id: key-check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is not configured; skipping PR Agent review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: PR Agent review
        if: steps.key-check.outputs.skip != 'true'
        uses: the-pr-agent/pr-agent@dec3e88c029c0a32957bd95aa694cb34d2b256e0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Get free key at https://openrouter.ai/settings/keys
          # Add as repo secret: Settings -> Secrets and variables -> Actions -> OPENROUTER_API_KEY
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Pin model via env (overrides .pr_agent.toml if both set - keep in sync)
          CONFIG__MODEL: "openrouter/thinkingmachines/inkling-2-small:free"
          CONFIG__FALLBACK_MODELS: '["openrouter/free"]'
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__REASONING_EFFORT: "low"
          OPENROUTER__REASONING_EFFORT: "low"
          CONFIG__AI_TIMEOUT: "300"
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"
          GITHUB_ACTION_CONFIG__FAIL_ON_COMMAND_ERRORS: "true"
          PR_REVIEWER__PERSISTENT_COMMENT: "true"
          PR_REVIEWER__INLINE_CODE_COMMENTS: "true"
          github_action_config.pr_actions: '["opened","reopened","ready_for_review","synchronize"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: ${{ github.event.action == 'opened' || github.event.action == 'ready_for_review' }}
          github_action_config.auto_improve: "false"
