name: PR Agent (Inkling-2-small:free)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for OpenRouter key
        id: key-check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is not configured; skipping PR Agent review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: PR Agent review
        if: steps.key-check.outputs.skip != 'true'
        uses: the-pr-agent/pr-agent@dec3e88c029c0a32957bd95aa694cb34d2b256e0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Get free key at https://openrouter.ai/settings/keys
          # Add as repo secret: Settings -> Secrets and variables -> Actions -> OPENROUTER_API_KEY
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Pin model via env (overrides .pr_agent.toml if both set - keep in sync)
          CONFIG__MODEL: "openrouter/thinkingmachines/inkling-2-small:free"
          CONFIG__FALLBACK_MODELS: '["openrouter/free"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__REASONING_EFFORT: "low"
