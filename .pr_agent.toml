[config]
# Free OpenRouter model - Thinking Machines Inkling 2 Small
model = "openrouter/thinkingmachines/inkling-2-small:free"
fallback_models = ["openrouter/free"]
# Inkling 2 Small advertises ~1M context / 131k output.
# PR-Agent doesn't know this new model yet, so set explicit budget.
custom_model_max_tokens = 200000
# Keep reasoning cheap/fast on free tier. Options: none, low, medium, high
reasoning_effort = "low"

[openrouter]
# key is injected via env OPENROUTER__KEY / secrets.OPENROUTER_API_KEY - don't hardcode
# Optional routing / cost controls (uncomment as needed):
# reasoning_effort = "low"
# max_tokens = 8000

[pr_reviewer]
# Review behavior - tune noise level
persistent_comment = false
inline_code_comments = true
ask_and_reflect = true

[github_action_config]
# auto commands on new PRs
auto_describe = true
auto_review = true
auto_improve = false
